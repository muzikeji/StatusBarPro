name: Build Tweak

on:
  push:
    tags: ['v*']
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      # 使用默认 debid package scheme, 不显式指定
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          brew install ldid xz
          # 用含 iOS 15 SDK 的 Xcode（与 TARGET:latest:15.5 匹配）
          sudo xcode-select --switch /Applications/Xcode_15.2.app 2>/dev/null \
            || sudo xcode-select --switch /Applications/Xcode_15.4.app 2>/dev/null \
            || true

      - name: Bootstrap Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout master 2>/dev/null || true
          "$THEOS/bin/update-theos" --no-package 2>&1 | tail -20 || true

      - name: Build
        run: |
          make clean 2>/dev/null || true
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatusBarPro-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: StatusBarPro-deb
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
          draft: true
