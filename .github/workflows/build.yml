name: Build Tweak

on:
  push:
    tags: ['v*']
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid + dpkg
        run: brew install ldid dpkg

      - name: Install Theos
        run: |
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          else
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS 15 SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks "$HOME/sdks-repo"
          if [ -d "$HOME/sdks-repo/iPhoneOS15.6.sdk" ]; then
            mkdir -p "$HOME/theos/sdks"
            cp -R "$HOME/sdks-repo/iPhoneOS15.6.sdk" "$HOME/theos/sdks/iPhoneOS15.6.sdk"
            cp -R "$HOME/sdks-repo/iPhoneOS15.6.sdk" "$HOME/theos/sdks/iPhoneOS15.5.sdk"
            echo "iOS 15.6 SDK installed"
          else
            echo "iOS 15.6 SDK not found"
            exit 1
          fi

      - name: Link iOS SDK
        shell: bash
        run: |
          SDK_PATH="$HOME/theos/sdks/iPhoneOS15.6.sdk"
          ln -sf "$SDK_PATH" "$HOME/theos/sdks/iPhoneOS.sdk"
          echo "iOS SDK: ${SDK_PATH}"

      - name: Build (${{ matrix.scheme }})
        env:
          THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$HOME/out"
          make clean THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} || true
          make package THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} FINALPACKAGE=1
          cp packages/*.deb "$HOME/out/"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: StatusBarPro-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - name: Download rootless .deb
        uses: actions/download-artifact@v4
        with:
          name: StatusBarPro-rootless
          path: dist
      - name: Download roothide .deb
        uses: actions/download-artifact@v4
        with:
          name: StatusBarPro-roothide
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
          draft: true